name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          # github.com/mattn/go-sqlite3 does not compile without cgo.
          cgo: true

  # The branch ruleset requires an "all-builds" status check, and the
  # go-toolchain action refuses to run in a job of that name, so aggregate.
  all-builds:
    runs-on: ubuntu-latest
    if: always()
    needs: [test]
    steps:
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          needs: ${{ toJSON(needs) }}
          script: |
            const failed = Object.entries(needs).filter(
              ([, job]) => job.result !== 'success' && job.result !== 'skipped'
            );
            if (failed.length > 0) {
              core.setFailed(
                failed.map(([name, job]) => `${name}: ${job.result}`).join(', ')
              );
            }
