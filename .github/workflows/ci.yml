name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  # The org's required "all-builds" status is posted by the
  # required-builds-manager app, which aggregates this repo's builds. Do not add
  # a job named all-builds: the toolchain rejects it as shadowing that gate.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          # github.com/mattn/go-sqlite3 does not compile without cgo.
          cgo: true
