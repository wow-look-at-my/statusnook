name: CI

on:
  push:

permissions:
  # id-token is needed even with autorelease off: go-toolchain fetches its
  # secrets from secret-server over OIDC on every run.
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cgo because mattn/go-sqlite3 does not compile without it.
      # autorelease off: nothing here is published. The binary is the app; the
      # config that drives an instance lives in wow-look-at-my/status and is
      # read by whatever statusnook is running.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          cgo: true
          autorelease: false
          # linux/amd64 only, and both halves of that are load-bearing. cgo
          # cross-compilation needs a C toolchain per target, which the runner
          # does not have, so every non-native pair fails to link sqlite3. And
          # postUpdate restarts the process with syscall.Kill, which does not
          # exist on Windows. The deployment is a linux/amd64 container.
          targets: linux/amd64
          # Approves generate.go's sqlc directive. go-toolchain pins the exact
          # command text by hash, so editing the directive fails the build until
          # this is updated to the hash it prints.
          generate: 92471f47bccf
